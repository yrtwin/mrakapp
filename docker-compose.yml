# VPS deploy: docker compose up -d --build
# needs .env (see .env.example) and a DNS A-record DOMAIN → server IP; Caddy issues the HTTPS certificate itself.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # superuser for maintenance only; the app connects as the non-superuser role from docker/db-init.sh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mrak8"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_MINIAPP_LINK: ${VITE_MINIAPP_LINK:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://mrak8:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mrak8
      SERVE_WEB: "1"
      PUBLIC_URL: https://${DOMAIN}
      WEBAPP_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/server/data/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8080
    volumes:
      - caddy:/data
    depends_on:
      - app

volumes:
  pgdata:
  media:
  caddy:
